[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/control-plane",
  "crates/driver-claude",
  "crates/driver-codex",
  "crates/driver-generic-terminal",
  "crates/driver-grok",
  "crates/driver-prime",
  "crates/pane-mcp",
  "crates/pty-host",
  "crates/shared-types",
  "crates/supervisor",
  "crates/terminal-viewport",
]
exclude = ["vendor/portable-pty"]

[workspace.package]
edition = "2024"
authors = ["Victor Valtchev", "Alexander Valtchev"]
license = "Apache-2.0"
repository = "https://github.com/vicitooo/PRIM-1"
description = "PRIM-1 — local desktop runtime for persistent, supervised terminal-first agent sessions."
keywords = ["agents", "ai", "pty", "tauri", "runtime"]
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.103"
chrono = { version = "0.4.42", features = ["serde"] }
dotenvy = "0.15"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
libc = "0.2.177"
parking_lot = "0.12.5"
portable-pty = { path = "vendor/portable-pty", version = "=0.9.0-prim1.1" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
unicode-width = "0.2.2"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }
