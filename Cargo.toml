[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/control-plane",
  "crates/driver-claude",
  "crates/driver-codex",
  "crates/driver-generic-terminal",
  "crates/pty-host",
  "crates/shared-types",
  "crates/supervisor",
]

[workspace.package]
edition = "2024"
authors = ["Victor", "Codex"]
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.42", features = ["serde"] }
libc = "0.2.177"
parking_lot = "0.12.5"
portable-pty = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
